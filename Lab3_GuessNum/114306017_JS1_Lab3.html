<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>

<body>
    <h1>114306017_Number Guessing</h1>

    <!-- 空的 div，用來放圖片 -->
    <div id="result"></div> 

    <script>
        var chances = 7;
        var ans = Math.floor(Math.random() * 100) + 1;
        var max = 100;
        var min = 1;

        while (chances > 0) {

            var input = window.prompt(
                "請輸入 " + min + " 到 " + max + " 之間的整數\n" +
                "你還有 " + chances + " 次機會"
            );

            if (input === null) {
                alert("輸入不可為空");
                continue;
            }

            input = input.trim();


            if (input === "" || isNaN(input)) {
                alert("無效輸入，請輸入 1 到 100 之間的整數");
                continue;
            }

            var guess = Number(input);

            // 範圍外
            if (guess <= min || guess >= max) {
                alert("請輸入 " + min + " 到 " + max + " 之間的整數");
                continue;
            }

            // 正確
            if (guess === ans) {
                alert("恭喜你答對了！正確答案是" + ans);
                document.getElementById("result").innerHTML =
                    '<img src="correct.jpg" alt="correct" style="width:300px;">';
                break;
            }

            // 錯 範圍更新
            if (guess < ans) {
                min = guess;
            } else {
                max = guess;
            }

            chances--;
        }

        // 猜錯用完
        if (chances === 0) {
            alert("次數用完！正確答案是 " + ans);
            document.getElementById("result").innerHTML =
                '<img src="wrong.jpg" alt="wrong" style="width:300px;">';
        }
    </script>

</body>
</html>
