<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW8_JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calc-container">
        <h2>JS Calculator</h2>
        
        <label>Number 1</label>
        <input type="number" id="num1">

        <label>Number 2</label>
        <input type="number" id="num2">

        <label>Operate way?</label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <button id="calcBtn" style="color: white; width: 100%; margin-top: 10px;">Calculate</button>

        <h3 id="resultDisplay">Result = </h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
