<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>
		Lab4_Grade Statistics
	</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class = "container">
		<h2>Grade Statistics</h2>
		<div class = "input">
			<label><input type = "number" id = "mathInput" placeholder = "Math"></label>
			<label><input type = "number" id = "englishInput" placeholder = "English"></label>
			<button id = "submitBtn">Submit</button>
		</div>
		<table>
			<thead>
				<tr>
					<th>#</th>
					<th>Math</th>
					<th>English</th>
					<th>Average</th>
				</tr>
			</thead>
			<tbody id = "gradeTableBody">
			</tbody>
			<tfoot>
				<tr>
					<td>Average</td>
					<td id="mathAvg">0.00</td>
                    <td id="engAvg">0.00</td>
                    <td id="overallAvg">0.00</td>
                </tr>
			</tfoot>
		</table>
	</div>
	<script src="script.js"></script>
</body>
</html>
